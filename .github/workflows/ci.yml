name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the older run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # src/lib/supabase/admin.ts polyfills WebSocket specifically because
        # Node 20 lacks the global that Node 22+ ships. Testing both means a
        # change that only works on one of them fails here rather than in
        # production, whichever version Vercel is currently pinned to.
        node: [20, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile has drifted from package.json. Its postinstall runs
      # `prisma generate`, so the client exists for every step below.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Every route in this app is server-rendered on demand, so the build
      # never queries the database — but the modules still read these vars at
      # import time. Placeholder values are enough to compile, and using them
      # here guarantees CI can never touch a real database.
      - name: Build
        run: npm run build:ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?pgbouncer=true
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
